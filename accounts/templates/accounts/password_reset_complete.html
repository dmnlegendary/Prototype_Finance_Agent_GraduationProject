{% extends "base_auth.html" %}
{% load static %}

{% block body_attrs %} class="d-flex align-items-center justify-content-center min-vh-100 p-3"{% endblock %}

{% block content %}
<div class="w-100" style="max-width: 420px;">
    <div class="text-center mb-4">
        <img src="{% static 'img/logo_mariamiga.png' %}" alt="marIA" class="app-logo mb-2">
        <h1 class="h4 fw-bold mb-0">marIA</h1>
    </div>

    <div class="card card-auth p-4 text-center">
        <i class="bi bi-check-circle-fill" style="font-size:40px;color:var(--color-success);"></i>
        <h2 class="h6 fw-bold mt-3 mb-1">Contraseña actualizada</h2>
        <p class="small text-muted mb-0">Ya puedes iniciar sesión con tu contraseña nueva.</p>
        <a href="{% url 'accounts:login' %}" class="btn btn-primary w-100 fw-bold py-2 mt-3">Iniciar sesión</a>
    </div>
</div>
{% endblock %}
