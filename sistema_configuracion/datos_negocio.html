<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datos del Negocio</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #f0f4ff; font-family: 'Segoe UI', sans-serif; }
        .card { box-shadow: 0 8px 32px rgba(79,70,229,0.10); }
        .btn-primary { background: linear-gradient(135deg, #4f46e5, #7c3aed); }
        .input-field:focus { border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79,70,229,0.15); }
        .step-active { background: #4f46e5; color: white; }
        .step-done { background: #10b981; color: white; }
        .step-inactive { background: #e5e7eb; color: #9ca3af; }
        .toggle { position: relative; display: inline-block; width: 44px; height: 24px; }
        .toggle input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: #4f46e5; border-radius: 24px; transition: .3s; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: .3s; transform: translateX(20px); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-md">

        <!-- Logo -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl btn-primary mb-3">
                <i class="fas fa-store text-white text-2xl"></i>
            </div>
            <h1 class="text-2xl font-black text-gray-800">Tiendita <span class="text-indigo-600">AI</span></h1>
        </div>

        <!-- Stepper -->
        <div class="flex items-center justify-center mb-8 gap-2">
            <div class="flex flex-col items-center">
                <div class="w-8 h-8 rounded-full step-done flex items-center justify-center text-sm font-bold">
                    <i class="fas fa-check text-xs"></i>
                </div>
                <span class="text-xs mt-1 text-green-600 font-semibold">Cuenta</span>
            </div>
            <div class="flex-1 h-0.5 bg-green-300 mb-4"></div>
            <div class="flex flex-col items-center">
                <div class="w-8 h-8 rounded-full step-active flex items-center justify-center text-sm font-bold">2</div>
                <span class="text-xs mt-1 text-indigo-600 font-semibold">Negocio</span>
            </div>
            <div class="flex-1 h-0.5 bg-gray-200 mb-4"></div>
            <div class="flex flex-col items-center">
                <div class="w-8 h-8 rounded-full step-inactive flex items-center justify-center text-sm font-bold">3</div>
                <span class="text-xs mt-1 text-gray-400">Productos</span>
            </div>
        </div>

        <!-- Card -->
        <div class="bg-white rounded-2xl card p-8">
            <h2 class="text-lg font-bold text-gray-800 mb-1">Cuéntanos de tu tienda</h2>
            <p class="text-sm text-gray-500 mb-6">Esta información nos ayuda a personalizar tu experiencia</p>

            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Nombre de tu tienda</label>
                    <div class="relative">
                        <i class="fas fa-store absolute left-3 top-3 text-gray-400 text-sm"></i>
                        <input type="text" placeholder="Ej. Abarrotes Don Raúl"
                            class="input-field w-full pl-9 pr-4 py-2.5 border border-gray-200 rounded-xl text-sm outline-none transition bg-gray-50">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Alcaldía / Colonia</label>
                    <div class="relative">
                        <i class="fas fa-map-marker-alt absolute left-3 top-3 text-gray-400 text-sm"></i>
                        <select class="input-field w-full pl-9 pr-4 py-2.5 border border-gray-200 rounded-xl text-sm outline-none transition bg-gray-50 appearance-none">
                            <option value="">Selecciona tu alcaldía...</option>
                            <option>Iztapalapa</option>
                            <option>Gustavo A. Madero</option>
                            <option>Álvaro Obregón</option>
                            <option>Tlalpan</option>
                            <option>Coyoacán</option>
                            <option>Xochimilco</option>
                            <option>Otra</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Años de operación</label>
                    <div class="relative">
                        <i class="fas fa-calendar absolute left-3 top-3 text-gray-400 text-sm"></i>
                        <select class="input-field w-full pl-9 pr-4 py-2.5 border border-gray-200 rounded-xl text-sm outline-none transition bg-gray-50 appearance-none">
                            <option>Menos de 1 año</option>
                            <option>1 a 3 años</option>
                            <option selected>3 a 10 años</option>
                            <option>Más de 10 años</option>
                        </select>
                    </div>
                </div>

                <!-- RESICO Switch -->
                <div class="bg-indigo-50 rounded-xl p-4 border border-indigo-100">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-sm font-bold text-indigo-800">¿Estás en el régimen RESICO?</p>
                            <p class="text-xs text-indigo-500 mt-0.5">Activar para calcular tu ISR automáticamente</p>
                        </div>
                        <label class="toggle">
                            <input type="checkbox" checked>
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="mt-3 pt-3 border-t border-indigo-100">
                        <label class="block text-xs font-semibold text-indigo-700 mb-1">RFC (opcional)</label>
                        <input type="text" placeholder="MARL850312AB3"
                            class="w-full px-3 py-2 border border-indigo-200 rounded-lg text-xs outline-none bg-white focus:border-indigo-400">
                    </div>
                </div>

                <button class="btn-primary w-full text-white font-bold py-3 rounded-xl text-sm mt-2 transition">
                    Continuar <i class="fas fa-arrow-right ml-2"></i>
                </button>
            </div>
        </div>
    </div>
</body>
</html>
