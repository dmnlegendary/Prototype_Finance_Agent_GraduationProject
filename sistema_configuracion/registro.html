<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Cuenta</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #f0f4ff; font-family: 'Segoe UI', sans-serif; }
        .card { box-shadow: 0 8px 32px rgba(79,70,229,0.10); }
        .btn-primary { background: linear-gradient(135deg, #4f46e5, #7c3aed); }
        .btn-primary:hover { opacity: 0.92; }
        .input-field:focus { border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79,70,229,0.15); }
        .step-active { background: #4f46e5; color: white; }
        .step-done { background: #10b981; color: white; }
        .step-inactive { background: #e5e7eb; color: #9ca3af; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-md">

        <!-- Logo / Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl btn-primary mb-3">
                <i class="fas fa-store text-white text-2xl"></i>
            </div>
            <h1 class="text-2xl font-black text-gray-800">Tiendita <span class="text-indigo-600">AI</span></h1>
            <p class="text-gray-500 text-sm mt-1">Tu asistente inteligente para tu negocio</p>
        </div>

        <!-- Stepper -->
        <div class="flex items-center justify-center mb-8 gap-2">
            <div class="flex flex-col items-center">
                <div class="w-8 h-8 rounded-full step-active flex items-center justify-center text-sm font-bold">1</div>
                <span class="text-xs mt-1 text-indigo-600 font-semibold">Cuenta</span>
            </div>
            <div class="flex-1 h-0.5 bg-gray-200 mb-4"></div>
            <div class="flex flex-col items-center">
                <div class="w-8 h-8 rounded-full step-inactive flex items-center justify-center text-sm font-bold">2</div>
                <span class="text-xs mt-1 text-gray-400">Negocio</span>
            </div>
            <div class="flex-1 h-0.5 bg-gray-200 mb-4"></div>
            <div class="flex flex-col items-center">
                <div class="w-8 h-8 rounded-full step-inactive flex items-center justify-center text-sm font-bold">3</div>
                <span class="text-xs mt-1 text-gray-400">Productos</span>
            </div>
        </div>

        <!-- Card -->
        <div class="bg-white rounded-2xl card p-8">
            <h2 class="text-lg font-bold text-gray-800 mb-1">Crea tu cuenta</h2>
            <p class="text-sm text-gray-500 mb-6">Ingresa tus datos para comenzar</p>

            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Nombre completo</label>
                    <div class="relative">
                        <i class="fas fa-user absolute left-3 top-3 text-gray-400 text-sm"></i>
                        <input type="text" placeholder="Ej. Raúl Martínez López"
                            class="input-field w-full pl-9 pr-4 py-2.5 border border-gray-200 rounded-xl text-sm outline-none transition bg-gray-50">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Teléfono celular</label>
                    <div class="relative">
                        <i class="fas fa-mobile-alt absolute left-3 top-3 text-gray-400 text-sm"></i>
                        <input type="tel" placeholder="55 1234 5678"
                            class="input-field w-full pl-9 pr-4 py-2.5 border border-gray-200 rounded-xl text-sm outline-none transition bg-gray-50">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Correo electrónico <span class="text-gray-400 font-normal">(opcional)</span></label>
                    <div class="relative">
                        <i class="fas fa-envelope absolute left-3 top-3 text-gray-400 text-sm"></i>
                        <input type="email" placeholder="correo@ejemplo.com"
                            class="input-field w-full pl-9 pr-4 py-2.5 border border-gray-200 rounded-xl text-sm outline-none transition bg-gray-50">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Contraseña</label>
                    <div class="relative">
                        <i class="fas fa-lock absolute left-3 top-3 text-gray-400 text-sm"></i>
                        <input type="password" placeholder="Mínimo 6 caracteres"
                            class="input-field w-full pl-9 pr-10 py-2.5 border border-gray-200 rounded-xl text-sm outline-none transition bg-gray-50">
                        <i class="fas fa-eye absolute right-3 top-3 text-gray-400 text-sm cursor-pointer"></i>
                    </div>
                </div>

                <div class="flex items-start gap-2 pt-1">
                    <input type="checkbox" class="mt-0.5 accent-indigo-600">
                    <p class="text-xs text-gray-500">Acepto los <span class="text-indigo-600 font-semibold cursor-pointer">Términos y condiciones</span> y el <span class="text-indigo-600 font-semibold cursor-pointer">Aviso de privacidad</span></p>
                </div>

                <button class="btn-primary w-full text-white font-bold py-3 rounded-xl text-sm mt-2 transition">
                    Continuar <i class="fas fa-arrow-right ml-2"></i>
                </button>
            </div>

            <p class="text-center text-xs text-gray-400 mt-6">¿Ya tienes cuenta? <span class="text-indigo-600 font-semibold cursor-pointer">Inicia sesión</span></p>
        </div>
    </div>
</body>
</html>
