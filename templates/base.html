<!DOCTYPE html>
<html lang="es">
<head>
{% load static %}
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MarIAmiga</title>
<link rel="icon" href="{% static 'img/logo_mariamiga.webp' %}">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="{% static 'css/loader.css' %}">
{% block extra_head %}{% endblock %}
</head>
<body{% block body_attrs %}{% endblock %}>

<div class="ai-loader-overlay" id="loaderInicial" style="display:none;">
  {% include "partials/ai_loader.html" with texto="Cargando…" grande=True %}
</div>

{% block content %}{% endblock %}
{% block extra_scripts %}{% endblock %}

<script>
  function mostrarLoaderCompleto(texto) {
    const loader = document.getElementById('loaderInicial');
    if (!loader) return;
    const textoEl = loader.querySelector('.ai-loader-text');
    if (textoEl && texto) textoEl.textContent = texto;
    loader.classList.remove('oculto');
    loader.style.display = 'flex';
  }

  (function () {
    const loader = document.getElementById('loaderInicial');
    if (!loader) return;

    let omitir = false;
    try {
      omitir = sessionStorage.getItem('omitir_loader') === '1';
      sessionStorage.removeItem('omitir_loader');
    } catch (e) {}
    if (omitir) return;

    // "recargar la página" (F5) se detecta con la Navigation Timing API;
    // una redirección de una acción (agregar al carrito, +/-, etc.) regresa
    // a la MISMA ruta de donde salió, así que esa no cuenta como "cargar".
    let tipoNavegacion = 'navigate';
    const entradas = performance.getEntriesByType ? performance.getEntriesByType('navigation') : [];
    if (entradas && entradas.length) tipoNavegacion = entradas[0].type;

    let rutaAnterior = null;
    try { rutaAnterior = document.referrer ? new URL(document.referrer).pathname : null; } catch (e) {}
    const mismaRuta = rutaAnterior === window.location.pathname;

    const esRecarga = tipoNavegacion === 'reload';
    const esNavegacionNueva = !mismaRuta;

    if (esRecarga || esNavegacionNueva) {
      loader.style.display = 'flex';
      window.addEventListener('load', function () {
        setTimeout(function () { loader.classList.add('oculto'); }, 4200);
      });
    }
  })();
</script>
</body>
</html>
