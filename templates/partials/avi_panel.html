<!-- Panel del chat con el asistente. Es el mismo en ventas, inventario y finanzas;
     la conversación de las últimas 24 horas se carga sola desde el servidor (app.js). -->
<div class="avi-overlay" id="aviOverlay" onclick="closeAvi()"></div>
<button class="fab-avi" onclick="openAvi()" title="Abrir asistente"><i class="bi bi-robot"></i></button>

<div class="avi-panel" id="aviPanel">
  <div class="avi-title">
    <span><i class="bi bi-robot"></i> Asistente Virtual</span>
    <div class="avi-title-actions">
      <button class="avi-clear-btn" onclick="limpiarChatAvi()" title="Vaciar chat"><i class="bi bi-trash3"></i></button>
      <button class="avi-minimize-btn" onclick="toggleAviMinimize()" title="Minimizar"><i class="bi bi-dash-lg"></i></button>
      <button class="avi-expand-btn" onclick="toggleAviExpand()" title="Pantalla completa"><i class="bi bi-arrows-fullscreen"></i></button>
      <button class="avi-toggle-btn" onclick="closeAvi()"><i class="bi bi-x-lg"></i></button>
    </div>
  </div>
  <div class="avi-chat" id="aviChat" data-saludo="Hola 👋 Soy marIA. Te ayudo con tus ventas, tu inventario y tus gastos. Prueba: &quot;agrega 2 pepsis&quot;, &quot;¿cuánto vendí hoy?&quot; o &quot;¿qué tengo que resurtir?&quot;.">
    <div class="bubble bot">Hola 👋 Soy marIA. Te ayudo con tus ventas, tu inventario y tus gastos. Prueba: "agrega 2 pepsis", "¿cuánto vendí hoy?" o "¿qué tengo que resurtir?".</div>
  </div>
  <form class="avi-input" id="aviForm" onsubmit="return enviarMensajeAvi(event)">
    {% csrf_token %}
    <input type="text" id="aviTexto" placeholder="Escribe aquí… (ej. 2 coca cola 600)" autocomplete="off"/>
    <button type="button" class="avi-mic-btn" onclick="activarMicrofono()" title="Hablar"><i class="bi bi-mic-fill"></i></button>
    <button type="submit"><i class="bi bi-send-fill"></i></button>
  </form>
</div>
